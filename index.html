<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Тест: Таблица умножения и деления</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/question.css">
<link rel="stylesheet" href="css/exam.css">
<link rel="stylesheet" href="css/results.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app">
<h1>✕ Таблица умножения и ÷ деления</h1>
<p class="subtitle">Проверь свои знания!</p>

<div id="screen-settings" class="screen active">
<div class="settings-card">
<div class="setting-row">
<label>Количество вопросов:</label>
<input id="q-count" type="number" min="1" max="126" value="20">
</div>
<div class="toggle-group">
<button type="button" class="toggle-btn active" data-type="multiply" onclick="toggleType(this)">✕ Умножение</button>
<button type="button" class="toggle-btn active" data-type="divide" onclick="toggleType(this)">÷ Деление</button>
</div>
<div class="q-buttons">
<button type="button" class="btn btn-primary" onclick="startTraining()">🏋 Тренировка</button>
<button type="button" class="btn btn-primary" onclick="startExam()">⏱ Экзамен</button>
</div>
</div>
</div>

<div id="screen-test" class="screen"></div>

<div id="screen-results" class="screen">
<div class="results-card">
<div id="result-text"></div>
<button class="btn btn-secondary" onclick="location.reload()">Начать заново</button>
</div>
</div>
</div>

<script src="js/questions.js"></script>
<script src="js/training.js"></script>
<script src="js/exam.js"></script>
<script src="js/timer.js"></script>
<script src="js/statistics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
