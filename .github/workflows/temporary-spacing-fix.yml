name: Temporary spacing fix
on:
  push:
    paths:
      - '.github/workflows/temporary-spacing-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile spacing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('multiplication_test.html')
          s = p.read_text(encoding='utf-8')
          old = '@media(max-width:600px) and (max-height:700px){.app{margin-top:0}h1{font-size:1.15rem}.subtitle{display:none}.progress-area{margin-bottom:6px}.question-expression{margin-bottom:12px}.q-answer-input{height:52px}.answer-feedback{margin-top:8px}.q-buttons{margin-top:12px;gap:5px}'
          new = '@media(max-width:600px) and (max-height:700px){.app{margin-top:0}h1{font-size:1.15rem}.subtitle{display:none}.progress-area{margin-bottom:6px}.question-expression{margin-bottom:12px}.q-answer-input{height:52px}.question-card{padding-bottom:20px}.answer-feedback{margin-top:16px}.q-buttons{margin-top:20px;gap:5px}'
          if old not in s:
              raise SystemExit('target CSS block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multiplication_test.html
          git commit -m 'Increase mobile spacing around answer feedback and buttons'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/temporary-spacing-fix.yml || true
          git commit -m 'Remove temporary spacing workflow' || true
          git push || true
